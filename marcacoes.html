<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcações</title>
    <link rel="stylesheet" href="css/marcacoes.css">
    <link rel="stylesheet" href="css/calendario.css">
    <script src="api/marcacoes.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">

<body>
    <header>
    <nav class="wrap">
        <a href="barbershop.html" class="logo">Olimpo  <span>Barbershop</span></a>
    </nav>
    </header>
    <section class="DropDown profissional">
        <select name="Profissional" id="profi">
            <option value="" disabled selected hidden>escolha o profissional</option>
            <option value="Robert Simon">Robert Simon</option>
            <option value="Yes1">Yes1</option>
            <option value="Yes2">Yes2</option>
            <option value="Yes3">Yes3</option>
        </select>

        <div class="campo-data">
            <input
                type="text"
                id="dataMarcacao"
                placeholder="Selecione uma data"
                readonly
                disabled
            >
        </div>
        
    </section>
    
    <section class="calendario_marc" id="calendario">
        <div class="calendario">
            <div class="inner_calendario">

                        <h2 class="month_year">Julho, 2026</h2> <!-- o texto é de exemplo (mudado no .js) -->

                    </div>
                    <div class="data">

                            <li>Qua</li>

</html>
